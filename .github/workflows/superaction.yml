# google/gson's .github/workflows/build.yml: build (java 25, java-package jdk, ubuntu-latest), for the Superaction scoreboard.
name: Superaction

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # Common Maven arguments
  MAVEN_ARGS: --show-version --batch-mode --no-transfer-progress

jobs:
  test:
    name: test / superaction-fabric
    runs-on: superaction-fabric
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: "Set up JDK 25"
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: 'temurin'
          java-version: 25
          java-package: jdk
          cache: 'maven'
      - name: Build with Maven
        # This also runs javadoc:jar to detect any issues with the Javadoc generated during release
        run: mvn verify javadoc:jar
